name: Build Android APK
on:
push:
branches:
- main
workflow_dispatch:
jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout Code
uses: actions/checkout@v4
- name: Setup Node.js
uses: actions/setup-node@v4
with:
node-version: 18
- name: Build Web App Bundle
run: |
mkdir -p build
cp -r www/* build/ || true
- name: Upload Web Build Package
uses: actions/upload-artifact@v4
with:
name: Karaoke-Web-App
path: build/
